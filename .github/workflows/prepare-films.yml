name: Optimize and publish GYRO films
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-films.yml'
permissions:
  contents: write
jobs:
  process-films:
    name: Generate mobile-friendly native videos
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Google Drive downloader
        run: python -m pip install --disable-pip-version-check "gdown>=5,<6"
      - name: Install FFmpeg for video encoding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and optimize seven public collaboration films
        run: |
          mkdir -p videos posters
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import time
          import gdown
          sources = [["origen","15OiFeJc5G5HZIePGEuM54toj7Yr7sHEf"],["encuentro","15DddVSw4GiBGptsxCVUQB8xtod9h0O3Y"],["materia","1pQNYEaFl75Bfvrq2ZxqUBdnahMhjZe87"],["umbral","1cQarjV_axRQOOm0ngkcY3800sXnLPnO0"],["descanso","1rxizq9h24S2kcTYtDffI3Htb5mECeX_d"],["pausa","1fVhDkMQDqVucUilC8mkx9fJ9Uh-KDnxE"],["refugio","1fX-01Gh1hp0-Mpblayq6cTWunjVnssaD"]]
          for slug, file_id in sources:
              target = Path('videos') / f'{slug}.mp4'
              poster = Path('posters') / f'{slug}.jpg'
              if target.exists() and target.stat().st_size > 100_000 and poster.exists():
                  print(f'Skipping {slug}; already optimized', flush=True)
                  continue
              original = Path('/tmp') / f'gyro_{slug}_original.mp4'
              for attempt in range(1, 4):
                  try:
                      print(f'Downloading {slug}, attempt {attempt}/3', flush=True)
                      result = gdown.download(id=file_id, output=str(original), quiet=False, fuzzy=True)
                      if not result or not original.exists() or original.stat().st_size < 100_000:
                          raise RuntimeError(f'Incomplete download for {slug}')
                      break
                  except Exception as exc:
                      print(f'Download error: {exc}', flush=True)
                      if attempt == 3: raise
                      time.sleep(8 * attempt)
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-i', str(original),
                  '-map','0:v:0','-map','0:a:0?',
                  '-vf','scale=w=1920:h=-2:flags=lanczos',
                  '-c:v','libx264','-preset','veryfast','-crf','24',
                  '-pix_fmt','yuv420p','-movflags','+faststart',
                  '-c:a','aac','-b:a','128k',
                  str(target)
              ], check=True)
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-ss','00:00:08','-i',str(original),
                  '-frames:v','1','-vf','scale=1280:-2','-q:v','3',str(poster)
              ], check=True)
              original.unlink(missing_ok=True)
              print(f'Finished {slug}: {target.stat().st_size/1_000_000:.2f} MB',flush=True)
          PY
      - name: Commit optimized media to GitHub Pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/*.mp4 posters/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized native video files for responsive film viewer"
            git push origin HEAD:main
          else
            echo 'Media already committed'
          fi
